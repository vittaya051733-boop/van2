<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VANTALAD customer web app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VANTALAD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VANTALAD</title>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB6Q5DE_VkpqO3qTn3bqPBawQjxzGEngxY"></script>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    #flutter-loading {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      color: #5d4037;
      font: 16px/1.4 sans-serif;
    }
  </style>

  <script id="flutter-load-script">
    function removeSplashFromWeb() {
      document.getElementById("flutter-loading")?.remove();
      window.clearTimeout(window._flutterLoaderTimeout);
      document.getElementById("flutter-load-error")?.remove();
    }

    window.addEventListener("error", function (event) {
      const message = event?.message || "";
      if (!message.includes("flutter") && !message.includes("canvaskit")) {
        return;
      }
      showFlutterLoadError("โหลดแอปไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
    });

    window._flutterLoaderTimeout = window.setTimeout(function () {
      if (!document.getElementById("flutter-loading")) {
        return;
      }
      showFlutterLoadError("โหลดนานผิดปกติ กรุณารีเฟรชหรือลอง Safari อีกครั้ง");
    }, 45000);

    function showFlutterLoadError(text) {
      if (document.getElementById("flutter-load-error")) {
        return;
      }
      const error = document.createElement("p");
      error.id = "flutter-load-error";
      error.textContent = text;
      error.style.cssText =
        "position:fixed;left:16px;right:16px;bottom:24px;margin:0;padding:12px 16px;border-radius:12px;background:#fff3e0;color:#5d4037;font:16px/1.4 sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:9999;";
      document.body.appendChild(error);
    }
  </script>
</head>
<body>
  <div id="flutter-loading">กำลังโหลด VANTALAD...</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
